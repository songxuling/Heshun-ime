# 智能 ABC 双拼方案，规则来自 rime-double-pinyin/double_pinyin_abc.schema.yaml
schema:
  schema_id: double_pinyin_abc
  name: 智能ABC双拼
  version: "0.17"
engine:
  type: script
dictionary:
  file: pinyin_abc.bin
  source: pinyin_simp.dict.yaml
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  algebra:
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - xform/^zh/A/
    - xform/^ch/E/
    - xform/^sh/V/
    - xform/^([aoe].*)$/O$1/
    - xform/ei$/Q/
    - xform/ian$/W/
    - xform/er$|iu$/R/
    - xform/[iu]ang$/T/
    - xform/ing$/Y/
    - xform/uo$/O/
    - xform/uan$/P/
    - xform/i?ong$/S/
    - xform/[iu]a$/D/
    - xform/en$/F/
    - xform/eng$/G/
    - xform/ang$/H/
    - xform/an$/J/
    - xform/iao$/Z/
    - xform/ao$/K/
    - xform/in$|uai$/C/
    - xform/ai$/L/
    - xform/ie$/X/
    - xform/ou$/B/
    - xform/un$/N/
    - xform/[uv]e$|ui$/M/
    - xlit/QWERTYOPASDFGHJKLZXCVBNM/qwertyopasdfghjklzxcvbnm/
punctuator:
  full_shape: true
user_dict:
  file: ../data/double_pinyin_abc.userdb.json
