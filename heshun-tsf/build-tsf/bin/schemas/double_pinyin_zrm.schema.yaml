# double_pinyin_zrm.schema.yaml — 自然码双拼方案
# 双拼反向映射（ZRM1）在 build 阶段由 speller.algebra 构建并内嵌到二进制，
# 运行时无需再解析 algebra。
schema:
  schema_id: double_pinyin_zrm
  name: 自然码双拼
  version: "0.1"

engine:
  type: script

dictionary:
  file: pinyin_zrm.bin
  source: pinyin_simp.dict.yaml

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  algebra:
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Q/
    - xform/[iu]a$/W/
    - xform/[uv]an$/R/
    - xform/[uv]e$/T/
    - xform/ing$|uai$/Y/
    - xform/^sh/U/
    - xform/^ch/I/
    - xform/^zh/V/
    - xform/uo$/O/
    - xform/[uv]n$/P/
    - xform/i?ong$/S/
    - xform/[iu]ang$/D/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/(.)ang$/$1H/
    - xform/ian$/M/
    - xform/(.)an$/$1J/
    - xform/iao$/C/
    - xform/(.)ao$/$1K/
    - xform/(.)ai$/$1L/
    - xform/(.)ei$/$1Z/
    - xform/ie$/X/
    - xform/ui$/V/
    - xform/(.)ou$/$1B/
    - xform/in$/N/
    - xlit/QWRTYUIOPSDFGHMJCKLZXVBN/qwrtyuiopsdfghmjcklzxvbn/

punctuator:
  full_shape: true

user_dict:
  file: ../data/double_pinyin_zrm.userdb.json