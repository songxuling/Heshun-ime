# pinyin_full.schema.yaml — 全拼方案
schema:
  schema_id: pinyin_full
  name: 全拼
  version: "0.1"

engine:
  type: script

dictionary:
  file: pinyin_simp.bin
  source: pinyin_simp.dict.yaml

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"

punctuator:
  full_shape: true

user_dict:
  file: ../data/pinyin_full.userdb.json